version: 2
updates:
  # Frontend libraries served by the Encoder UI. Majors (e.g. Bootstrap 3 -> 5) need a UI
  # migration, so they are not proposed; security fixes still are.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: bootstrap
        update-types: ["version-update:semver-major"]
      - dependency-name: jquery
        update-types: ["version-update:semver-major"]

  # Release automation (CI only).
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
    groups:
      release-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The PHP version is the Encoder's runtime: CI tests 8.1-8.3, and 8.5 changed how OPcache is
  # built (docker-php-ext-install opcache fails). Move it deliberately, not as an automatic bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
