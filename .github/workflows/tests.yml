name: Encoder regression tests

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main", "develop" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php-versions }} Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pcre, mbstring, xml, curl, gd, pdo_mysql, zip, intl, pcntl
          coverage: none

      - name: Install media tools for real FFmpeg regressions
        # A stalled package mirror must fail fast and be retried, not consume the whole job timeout.
        timeout-minutes: 15
        run: |
          apt_options='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get $apt_options update \
              && sudo timeout 300 apt-get $apt_options install --yes ffmpeg zip unzip; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "apt-get attempt $attempt failed; retrying"
            sleep 10
          done
          ffmpeg -version
          ffprobe -version

      - name: Run every standalone PHP regression (required)
        run: |
          tests=(tests/*-regression.php)
          test -f "${tests[0]}"
          for test in "${tests[@]}"; do
            php "$test"
          done
